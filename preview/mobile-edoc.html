<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전자결재 · JH Solutions</title>
<style>
  :root{--blue:#1D5BA6;--blue-d:#16487f;--ink:#1a2330;--sub:#6b7787;--line:#e4eaf2;--bg:#eef2f7;--card:#fff;--violet:#7C3AED}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
  .phone{width:100%;max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh}
  .scr{padding:0 0 28px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 4px}
  .back{background:var(--card);border:1px solid var(--line);color:var(--blue);font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;cursor:pointer;font-family:inherit;box-shadow:0 2px 6px rgba(30,50,80,.05)}
  .back:active{background:#f0f4f9}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 4px 10px rgba(29,91,166,.3)}
  .hello{padding:18px 24px 6px}
  .hello .name{font-size:25px;font-weight:800;letter-spacing:-.5px;color:var(--violet)}
  .hello .sub{font-size:12.5px;color:var(--sub);margin-top:4px;font-weight:600}
  .lbl{font-size:12px;font-weight:800;color:#9aa8bc;letter-spacing:.5px;padding:22px 24px 12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 20px}
  .tile{background:var(--card);border-radius:20px;padding:18px 16px 16px;border:1px solid var(--line);cursor:pointer;position:relative;transition:transform .12s ease;display:flex;flex-direction:column;gap:12px;min-height:126px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .tile:active{transform:scale(.96)}
  .tile .ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px}
  .tile .nm{font-size:15px;font-weight:800;letter-spacing:-.3px}
  .tile .ds{font-size:11px;color:var(--sub);font-weight:500;line-height:1.4;margin-top:-4px}
  .tile .go{position:absolute;top:16px;right:14px;font-size:15px;color:#c3cedd}
  .c1 .ic{background:#f0edfb;color:#7C3AED}.c2 .ic{background:#eaf2fc;color:#1D5BA6}
  .c3 .ic{background:#e7f5ee;color:#1b8a5a}.c4 .ic{background:#eceff1;color:#455a64}
  .c5 .ic{background:#e0f2f1;color:#0d9488}.c6 .ic{background:#fdeede;color:#e08a1e}
  .c7 .ic{background:#fdecf0;color:#db2777}
  .wide{margin:14px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:15px;cursor:pointer;transition:transform .12s ease;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .wide:active{transform:scale(.98)}
  .wide .ic{width:52px;height:52px;border-radius:15px;flex-shrink:0;background:#fdecf0;color:#db2777;display:flex;align-items:center;justify-content:center;font-size:26px}
  .wide .nm{font-size:15px;font-weight:800}.wide .ds{font-size:11px;color:var(--sub);margin-top:2px}
  .wide .go{margin-left:auto;font-size:15px;color:#c3cedd}
  .hint{margin:22px 20px 0;padding:12px 14px;background:#fff7e6;border:1px solid #f5e2b8;border-radius:12px;font-size:11.5px;color:#8a6d1e;line-height:1.5;font-weight:600}
</style>
</head>
<body>
  <div class="phone"><div class="scr">
    <div class="top"><button class="back" onclick="location.href='mobile-home.html'">← 홈</button><div class="avatar">김</div></div>
    <div class="hello"><div class="name">전자결재</div><div class="sub">업무일지 · 연차 · 구매품의 · 지출결의</div></div>
    <div class="lbl">메뉴</div>
    <div class="grid">
      <div class="tile c1" onclick="alert('세부 화면은 준비 중입니다.')"><span class="go">›</span><div class="ic">📥</div><div class="nm">결재함</div><div class="ds">결재 대기·완료</div></div>
      <div class="tile c2" onclick="alert('세부 화면은 준비 중입니다.')"><span class="go">›</span><div class="ic">📔</div><div class="nm">업무일지</div><div class="ds">일일 업무</div></div>
      <div class="tile c3" onclick="alert('세부 화면은 준비 중입니다.')"><span class="go">›</span><div class="ic">🌴</div><div class="nm">연차신청서</div><div class="ds">연차 신청</div></div>
      <div class="tile c4" onclick="alert('세부 화면은 준비 중입니다.')"><span class="go">›</span><div class="ic">📄</div><div class="nm">퇴직원서</div><div class="ds">퇴직 신청</div></div>
      <div class="tile c5" onclick="alert('세부 화면은 준비 중입니다.')"><span class="go">›</span><div class="ic">📃</div><div class="nm">재직증명서</div><div class="ds">증명 발급</div></div>
      <div class="tile c6" onclick="alert('세부 화면은 준비 중입니다.')"><span class="go">›</span><div class="ic">🛒</div><div class="nm">구매품의서</div><div class="ds">구매 품의</div></div>
    </div>
    <div class="wide" onclick="alert('세부 화면은 준비 중입니다.')"><div class="ic">💳</div><div><div class="nm">지출결의서</div><div class="ds">지출 결의·정산</div></div><span class="go">›</span></div>
    <div class="hint">💡 전자결재 섹션 홈 골격입니다. 홈에서 전자결재 타일을 누르면 이 화면으로 들어옵니다. 각 문서(결재함·업무일지·품의서 등)는 순차로 실제 데이터를 붙이겠습니다.</div>
  </div></div>
</body>
</html>
