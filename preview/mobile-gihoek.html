<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기획 · JH Solutions (초안)</title>
<style>
  :root{
    --blue:#1D5BA6; --blue-d:#16487f; --blue-l:#4d86c4;
    --ink:#1a2330; --sub:#6b7787; --line:#e4eaf2; --bg:#eef2f7; --card:#fff;
    /* 하위 기능 색 */
    --pjt-bg:#eaf2fc;  --pjt-ic:#1D5BA6;
    --comp-bg:#e0f2f1; --comp-ic:#0d9488;
    --est-bg:#eef0fb;  --est-ic:#4f46e5;
    --settle-bg:#e7f5ee; --settle-ic:#1b8a5a;
    --acct-bg:#fdeede; --acct-ic:#e08a1e;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; min-height:100vh;
  }
  .phone{ width:100%; max-width:480px; margin:0 auto; background:var(--bg); min-height:100vh; }
  .scr{padding:0 0 26px}

  /* 상단바 (홈과 일관) */
  .top{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 22px 4px;
  }
  .back{
    background:var(--card); border:1px solid var(--line); color:var(--blue);
    font-size:13px; font-weight:700; padding:8px 14px; border-radius:12px;
    cursor:pointer; font-family:inherit; box-shadow:0 2px 6px rgba(30,50,80,.05);
  }
  .back:active{background:#f0f4f9}
  .avatar{
    width:40px; height:40px; border-radius:50%; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
    box-shadow:0 4px 10px rgba(29,91,166,.3);
  }
  /* 섹션 타이틀 (홈 인사 영역과 동일 리듬) */
  .hello{padding:18px 24px 6px}
  .hello .name{font-size:25px; font-weight:800; letter-spacing:-.5px; color:var(--blue)}
  .hello .sub{font-size:12.5px; color:var(--sub); margin-top:4px; font-weight:600}

  /* 요약 스트립 */
  .summary{
    display:flex; gap:10px; margin:16px 20px 0; padding:14px 16px;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 2px 8px rgba(30,50,80,.05);
  }
  .summary .s{flex:1; text-align:center}
  .summary .s + .s{border-left:1px solid var(--line)}
  .summary .s .n{font-size:20px; font-weight:800; color:var(--blue-d)}
  .summary .s .k{font-size:11px; color:var(--sub); font-weight:600; margin-top:2px}

  .lbl{font-size:12px; font-weight:800; color:#9aa8bc; letter-spacing:.5px;
    padding:22px 24px 12px; text-transform:uppercase}

  /* 기능 타일 2열 */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:0 20px}
  .tile{
    background:var(--card); border-radius:20px; padding:18px 16px 16px;
    border:1px solid var(--line); cursor:pointer; position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column; gap:12px; min-height:132px;
    box-shadow:0 2px 8px rgba(30,50,80,.05);
  }
  .tile:active{transform:scale(.96)}
  .tile .ic{width:54px; height:54px; border-radius:16px; display:flex;
    align-items:center; justify-content:center; font-size:28px}
  .tile .nm{font-size:16px; font-weight:800; letter-spacing:-.3px}
  .tile .ds{font-size:11.5px; color:var(--sub); font-weight:500; line-height:1.4; margin-top:-4px}
  .tile .go{position:absolute; top:18px; right:16px; font-size:16px; color:#c3cedd}

  .tile.pjt    .ic{background:var(--pjt-bg);    color:var(--pjt-ic)}
  .tile.comp   .ic{background:var(--comp-bg);   color:var(--comp-ic)}
  .tile.est    .ic{background:var(--est-bg);    color:var(--est-ic)}
  .tile.settle .ic{background:var(--settle-bg); color:var(--settle-ic)}

  /* 회계: 전체폭 가로 타일 */
  .wide{
    margin:14px 20px 0; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:16px 18px; display:flex; align-items:center; gap:15px;
    cursor:pointer; transition:transform .12s ease; box-shadow:0 2px 8px rgba(30,50,80,.05);
  }
  .wide:active{transform:scale(.98)}
  .wide .ic{width:54px; height:54px; border-radius:16px; flex-shrink:0;
    background:var(--acct-bg); color:var(--acct-ic);
    display:flex; align-items:center; justify-content:center; font-size:28px}
  .wide .nm{font-size:16px; font-weight:800; letter-spacing:-.3px}
  .wide .ds{font-size:11.5px; color:var(--sub); font-weight:500; margin-top:2px}
  .wide .go{margin-left:auto; font-size:16px; color:#c3cedd}

  .hint{
    margin:22px 20px 0; padding:12px 14px; background:#fff7e6; border:1px solid #f5e2b8;
    border-radius:12px; font-size:11.5px; color:#8a6d1e; line-height:1.5; font-weight:600;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="scr">

      <div class="top">
        <button class="back">← 홈</button>
        <div class="avatar">김</div>
      </div>

      <div class="hello">
        <div class="name">기획</div>
        <div class="sub">영업 · 정산 · 회계</div>
      </div>

      <div class="summary">
        <div class="s"><div class="n">3</div><div class="k">진행 프로젝트</div></div>
        <div class="s"><div class="n">5</div><div class="k">이번달 견적</div></div>
        <div class="s"><div class="n">2</div><div class="k">정산 대기</div></div>
      </div>

      <div class="lbl">기능</div>
      <div class="grid">
        <div class="tile pjt">
          <span class="go">›</span>
          <div class="ic">📊</div>
          <div>
            <div class="nm">프로젝트</div>
          </div>
          <div class="ds">진행 현황<br>손익 관리</div>
        </div>

        <div class="tile comp">
          <span class="go">›</span>
          <div class="ic">🤝</div>
          <div>
            <div class="nm">거래처</div>
          </div>
          <div class="ds">공급처 · 발행처<br>정보 관리</div>
        </div>

        <div class="tile est">
          <span class="go">›</span>
          <div class="ic">🧾</div>
          <div>
            <div class="nm">견적</div>
          </div>
          <div class="ds">견적서<br>작성 · 발행</div>
        </div>

        <div class="tile settle">
          <span class="go">›</span>
          <div class="ic">💰</div>
          <div>
            <div class="nm">정산</div>
          </div>
          <div class="ds">정산서<br>작성 · 발행</div>
        </div>
      </div>

      <div class="wide">
        <div class="ic">📒</div>
        <div>
          <div class="nm">회계</div>
          <div class="ds">지출 · 경비 관리, 손익 집계</div>
        </div>
        <span class="go">›</span>
      </div>

      <div class="hint">
        💡 기획 섹션 초안입니다. 홈에서 기획 타일을 누르면 이 화면으로 들어옵니다. 상단은 홈으로 돌아가는 뒤로가기 + 요약, 아래는 하위 기능(프로젝트·거래처·견적·정산·회계) 타일입니다. 요약 숫자·타일 색·배치 모두 조정 가능합니다.
      </div>

    </div>
  </div>
</body>
</html>
