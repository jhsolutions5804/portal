<style>

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
  .phone{width:100%;max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh}
  .scr{padding:0 0 30px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 4px}
  .back{background:var(--card);border:1px solid var(--line);color:var(--blue);font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;cursor:pointer;font-family:inherit;box-shadow:0 2px 6px rgba(30,50,80,.05)}

  .avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 4px 10px rgba(29,91,166,.3);cursor:pointer}
  .hello{padding:18px 24px 6px}
  .hello .name{font-size:25px;font-weight:800;letter-spacing:-.5px;color:var(--ok)}
  .hello .sub{font-size:12.5px;color:var(--sub);margin-top:4px;font-weight:600}
  .lbl{font-size:12px;font-weight:800;color:#9aa8bc;letter-spacing:.5px;padding:22px 24px 12px}
  .list{padding:0 20px;display:flex;flex-direction:column;gap:12px}
  .list.top{padding-top:16px}
  .fcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;cursor:pointer;transition:transform .12s ease;box-shadow:0 2px 8px rgba(30,50,80,.05);display:flex;align-items:center;gap:15px}
  .fcard:active{transform:scale(.98)}
  .fcard .ic{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
  .fcard.fab .ic{background:#e7f5ee;color:#1b8a5a}.fcard.sup .ic{background:#eaf2fc;color:#1D5BA6}
  .fcard .cl{font-size:12px;font-weight:700;color:var(--sub)}
  .fcard .nm{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:2px}
  .fcard .ds{font-size:11.5px;color:var(--sub);font-weight:500;margin-top:3px}
  .fcard .go{margin-left:auto;font-size:18px;color:#c3cedd;flex-shrink:0}
  .segs{display:flex;gap:8px;margin:14px 20px 0}
  .seg{flex:1;padding:11px;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--sub)}
  .seg.on{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 4px 10px rgba(27,138,90,.25)}
  .schcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:0 2px 8px rgba(30,50,80,.05);cursor:pointer;transition:transform .12s ease;display:flex;align-items:center;gap:11px}
  .schcard:active{transform:scale(.985)}
  .sch-time{font-size:12px;font-weight:800;color:var(--blue-d);min-width:44px;text-align:center;flex-shrink:0}
  .sch-body{flex:1;min-width:0}
  .sch-text{font-size:13.5px;font-weight:700}
  .sch-meta{font-size:11px;color:var(--sub);margin-top:2px}
  .sch-go{color:#c3cedd;font-size:15px;flex-shrink:0}
  .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .rep-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .rep-head{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .rtag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
  .rtag.ins{background:#e6f1fb;color:#0c447c}.rtag.brf{background:#faeeda;color:#633806}
  .rep-pjt{font-size:11px;color:#9aa8bc}
  .rep-text{font-size:13px;color:var(--ink);line-height:1.5}
  .empty{margin:8px 20px 0;padding:18px;text-align:center;color:#9aa8bc;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .loading{text-align:center;padding:40px;color:#9aa8bc;font-size:13px;font-weight:600}
  .banner{margin:14px 20px 0;padding:11px 14px;border-radius:12px;font-size:11.5px;font-weight:600;line-height:1.5}
  .banner.err{background:#fdecea;border:1px solid #f5c6c0;color:#a5342a}
  .banner.soft{background:#f4f6f9;border:1px solid var(--line);color:var(--sub)}
  .divider{height:1px;background:#e4eaf2;margin:18px 22px 4px}
  .dcard{margin:16px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .prog-sum{display:flex;gap:8px;margin:16px 20px 0;padding:14px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .prog-sum .pi{flex:1;text-align:center}
  .prog-sum .pi+.pi{border-left:1px solid var(--line)}
  .prog-sum .pil{font-size:10px;color:#9aa8bc;font-weight:700}
  .prog-sum .piv{font-size:17px;font-weight:800;margin-top:3px}
  .prog-leg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--sub);font-weight:600;margin:12px 20px 0}
  .pzcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .pz-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .pz-name{font-size:15px;font-weight:800}
  .pz-sub{font-size:11px;color:#9aa8bc;font-weight:600}
  .pz-pct{margin-left:auto;font-size:14px;font-weight:800;color:#1D5BA6;background:#eaf2fc;padding:3px 11px;border-radius:20px}
  .pz-bars{display:flex;gap:5px;margin-bottom:6px}
  .pz-lab{display:flex;gap:5px;font-size:9.5px;color:var(--sub);font-weight:600}
  .pz-lab span{flex:1;text-align:center;white-space:nowrap}
  .drow{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f2f5f9;gap:12px}
  .drow:last-child{border-bottom:none}
  .dk{font-size:12.5px;color:var(--sub);font-weight:600;white-space:nowrap}
  .dv{font-size:13.5px;font-weight:600;text-align:right;line-height:1.5}
</style>
</head>

};
// 일정 태그 (PC PJT홈과 동일)
const TAGS={in:{c:'#1D5BA6',l:'반입'},inspect:{c:'#2e7d32',l:'검수'},edu:{c:'#5e35b1',l:'교육'},off:{c:'#c0392b',l:'휴무'},leave:{c:'#e67e22',l:'연차'},meeting:{c:'#5D3A00',l:'회의'},fcu:{c:'#0A3D7A',l:'설치'},safety:{c:'#8D6E00',l:'안전'},admin:{c:'#7A8AA0',l:'행정'}};
function tagChip(t){ if(!t)return ''; const x=TAGS[t]; if(x) return `<span class="tag" style="background:${x.c}1a;color:${x.c}">${x.l}</span>`; return `<span class="tag" style="background:#eef2f7;color:#5c6f8a">${esc(t)}</span>`; }
// 섹터 구성 (기존 PJT 모듈 ZONES와 동일)
const ZONES={
  fab:[{name:'3F FIZ',total:39},{name:'X-OB',total:19},{name:'복합3동',total:14},{name:'복합4동',total:14},{name:'W-OB',total:81},{name:'2F 제조부속실',total:16}],
  sup:[{name:'(중공업) #20Core',total:3},{name:'(물산) #13Core',total:3},{name:'(물산) #14Core',total:3},{name:'(물산) #17Core',total:2}],
};
// 공정 계산용 상세 데이터 (기존 PJT 모듈과 동일)
const PROG={
  fab:{
    checkCols:['반입','입고검사','내진스토퍼','다이크','실링','동판','결선','시공검측'],
    installCols:['내진스토퍼','다이크','실링','동판','결선'],
    start:'2026-06-17',
    zones:[
      {id:'fiz',name:'3F FIZ',total:39,eqs:Array.from({length:39},(_,i)=>String(801+i))},
      {id:'xob',name:'X-OB',total:19,eqs:['861','862','863','864','865','866','867','868','869','870','871','872','873','874','875','876','877','878','879']},
      {id:'c3',name:'복합3동',total:14,eqs:['351','352','353','354','355','356','357','358','359','360','361','362','363','364']},
      {id:'c4',name:'복합4동',total:14,eqs:['302A','302B','302C','302D','302E','302F','302G','302H','302I','302J','302K','302L','302M','302N']},
      {id:'wob',name:'W-OB',total:81,eqs:Array.from({length:81},(_,i)=>'W-'+(101+i))},
      {id:'mfr',name:'2F 제조부속실',total:16,eqs:['801','802','811','812','813','814','815','816','817','818','819','820','821','822','823','824']},
    ],
    past:{
      '2026-06-17':{fiz:{'801_반입':true,'802_반입':true,'803_반입':true,'804_반입':true,'805_반입':true,'806_반입':true}},
      '2026-06-18':{fiz:{'807_반입':true,'808_반입':true,'809_반입':true,'820_반입':true,'821_반입':true,'822_반입':true,'823_반입':true,'801_입고검사':true,'802_입고검사':true,'803_입고검사':true,'804_입고검사':true,'805_입고검사':true,'806_입고검사':true}},
      '2026-06-19':{fiz:{'824_반입':true,'825_반입':true,'826_반입':true,'827_반입':true,'828_반입':true,'829_반입':true,'830_반입':true,'807_입고검사':true,'808_입고검사':true,'809_입고검사':true,'820_입고검사':true,'821_입고검사':true,'822_입고검사':true,'823_입고검사':true}},
      '2026-06-20':{fiz:{'824_입고검사':true,'825_입고검사':true,'826_입고검사':true,'827_입고검사':true,'828_입고검사':true,'829_입고검사':true,'830_입고검사':true}},
    },
  },
};
function calcZone(z,cks,cfg){
  let zIn=0,zAn=0,zInst=0,zChk=0,tot=0,instDone=0;
  z.eqs.forEach(eq=>{
    cfg.checkCols.forEach(c=>{if(cks[eq+'_'+c])tot++;});
    if(cks[eq+'_반입'])zIn++;
    if(cks[eq+'_입고검사'])zAn++;
    cfg.installCols.forEach(c=>{if(cks[eq+'_'+c])zInst++;});
    if(cks[eq+'_시공검측'])zChk++;
    if(cfg.installCols.every(c=>cks[eq+'_'+c]))instDone++;
  });
  const mx=z.total*cfg.checkCols.length;
  return {zIn,zAn,zInst,zChk,tot,mx,pct:+(tot/mx*100).toFixed(1),instDone,instBarPct:+(zInst/(z.total*cfg.installCols.length)*100).toFixed(0)};
}
function dateRange(start,end){ const out=[]; let d=new Date(start); const e=new Date(end); while(d<=e){ out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); d.setDate(d.getDate()+1);} return out; }
let progData=null, progLoaded=false, progLoadingSite=null;
async function loadProgress(s){
  const cfg=PROG[s]; if(!cfg){ progLoaded=true; progData={}; render(); return; }
  if(progLoadingSite===s) return; progLoadingSite=s; progLoaded=false; render();
  const byZone={}; cfg.zones.forEach(z=>byZone[z.id]={});
  // 1) 하드코딩 과거(PAST) 누적
  Object.keys(cfg.past).sort().forEach(dk=>{ Object.entries(cfg.past[dk]).forEach(([zid,ck])=>{ if(byZone[zid]) Object.assign(byZone[zid],ck); }); });
  // 2) Firebase progress_checks_{날짜} 누적 (시작일~오늘)
  const dates=dateRange(cfg.start, todayStr());
  for(const dk of dates){
    try{ const snap=await getDocs(collection(db,'progress_checks_'+dk)); snap.forEach(d=>{ const zid=d.id; const ck=(d.data()||{}).checks||{}; if(byZone[zid]) Object.assign(byZone[zid],ck); }); }catch(e){}
  }
  // 3) 오늘 localStorage
  const td=todayStr();
  cfg.zones.forEach(z=>{ try{ const t=JSON.parse(localStorage.getItem('fabls_eq_ck_'+td+'_'+z.id)||'{}'); Object.assign(byZone[z.id],t); }catch(e){} });
  progData=byZone; progLoaded=true; progLoadingSite=null; render();
}

let data={user_schedules:[],ph4_schedules:[],daily_report_docs:[],ph4_reports:[]};
let curView='home', site=null, sub='sched', detailId=null, loadError='';
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
let selectedDate=todayStr(), calMonth=todayStr().slice(0,7);

const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $app=()=>document.getElementById('app');
const fmtDate=v=>{if(!v)return '';if(v.seconds)return new Date(v.seconds*1000).toISOString().slice(0,10);return String(v).slice(0,10);};
const WD=['일','월','화','수','목','금','토'];

function nav(v,s){ curView=v; if(s!==undefined)site=s; history.pushState({v,site,sub,selectedDate,detailId},''); render(); window.scrollTo(0,0); }
window.openSite=function(s){ site=s; sub='sched'; selectedDate=todayStr(); calMonth=todayStr().slice(0,7); progLoaded=false; progData=null; progLoadingSite=null; nav('site',s); };
window.setSub=function(t){ sub=t; if(t==='sched'){ selectedDate=todayStr(); calMonth=todayStr().slice(0,7); } if(t==='progress' && !progLoaded && progLoadingSite!==site){ loadProgress(site); } render(); };
window.selectDate=function(d){ selectedDate=d; render(); };
window.shiftCalMonth=function(delta){ const [y,m]=calMonth.split('-').map(Number); const nm=new Date(y,m-1+delta,1); calMonth=nm.getFullYear()+'-'+String(nm.getMonth()+1).padStart(2,'0'); render(); };
window.openSched=function(id){ detailId=id; nav('schedD',site); };
window.goBack=function(){ history.back(); };
window.goHome=function(){ location.href='home.html'; };
window.goAccount=function(){ location.href='account.html'; };
window.addEventListener('popstate',e=>{ const st=e.state||{v:'home',site:null,sub:'sched'}; curView=st.v; site=st.site; sub=st.sub||'sched'; if(st.selectedDate)selectedDate=st.selectedDate; detailId=st.detailId||null; render(); window.scrollTo(0,0); });

function render(){
  if(loadError){ $app().innerHTML=topBar('홈','goHome()')+`<div class="banner err">데이터를 불러오지 못했습니다: ${esc(loadError)}<br>포털 로그인 세션이 필요할 수 있습니다.</div>`; return; }
  if(curView==='schedD') return renderSchedDetail();
  if(curView==='site') return renderSite();
  renderHome();
}
function topBar(label,onclick){ return `<div class="top"><button class="back" onclick="${onclick||'goBack()'}">← ${label}</button><div class="avatar" onclick="goAccount()">김</div></div>`; }

function renderHome(){
  $app().innerHTML=`
    <div class="top"><button class="back" onclick="goHome()">← 홈</button><div class="avatar" onclick="goAccount()">김</div></div>
    <div class="hello"><div class="name">PJT 관리</div><div class="sub">진행 중인 프로젝트 현장 관리</div></div>
    <div class="lbl">진행 프로젝트</div>
    <div class="list top">
      ${Object.entries(SITES).map(([k,s])=>`<div class="fcard ${s.cls}" onclick="openSite('${k}')">
        <div class="ic">${s.ic}</div>
        <div><div class="cl">${esc(s.client)}</div><div class="nm">${esc(s.code)}</div><div class="ds">${esc(s.desc)} · 공정·일정·근태</div></div>
        <span class="go">›</span></div>`).join('')}
    </div>`;
}

function renderSite(){
  const s=SITES[site]; if(!s){ renderHome(); return; }
  let body='';
  if(sub==='sched') body=renderCalendar(s);
  else if(sub==='progress') body=renderProgress();

    <div class="segs">
      <div class="seg ${sub==='progress'?'on':''}" onclick="setSub('progress')">공정</div>
      <div class="seg ${sub==='sched'?'on':''}" onclick="setSub('sched')">일정</div>
      <div class="seg ${sub==='attend'?'on':''}" onclick="setSub('attend')">근태</div>

function renderProgress(){
  const cfg=PROG[site];
  if(!cfg){
    const zs=ZONES[site]||[]; const tot=zs.reduce((a,z)=>a+z.total,0);
    return `<div class="lbl">📊 섹터 구성 · 총 ${tot}대</div>
      <div class="list top">${zs.map(z=>`<div class="schcard" style="cursor:default"><div class="sch-body"><div class="sch-text">${esc(z.name)}</div></div><span class="tag" style="background:#e7f5ee;color:#1b8a5a">${z.total}대</span></div>`).join('')}</div>
      <div class="banner soft">이 현장의 공정 진척은 순차로 붙일 예정입니다.</div>`;
  }
  if(!progLoaded) return '<div class="loading">공정 데이터 불러오는 중…</div>';
  let grand=0,gmax=0,totIn=0,totInst=0;
  const cards=cfg.zones.map(z=>{
    const r=calcZone(z,(progData&&progData[z.id])||{},cfg);
    grand+=r.tot; gmax+=r.mx; totIn+=r.zIn; totInst+=r.instDone;
    return progZoneCard(z,r);
  }).join('');
  const totalPct=gmax?(grand/gmax*100).toFixed(1):'0.0';
  const totQty=cfg.zones.reduce((a,z)=>a+z.total,0);
  return `
    <div class="prog-sum">
      <div class="pi"><div class="pil">전체 물량</div><div class="piv">${totQty}대</div></div>
      <div class="pi"><div class="pil">전체 공정율</div><div class="piv" style="color:#1D5BA6">${totalPct}%</div></div>
      <div class="pi"><div class="pil">누적 반입</div><div class="piv">${totIn}대</div></div>
      <div class="pi"><div class="pil">누적 설치</div><div class="piv">${totInst}대</div></div>
    </div>
    <div class="prog-leg"><span style="color:#1D5BA6">■</span>반입 <span style="color:#4aa3df">■</span>입고검사 <span style="color:#2e7d32">■</span>설치 <span style="color:#7c3aed">■</span>시공검측</div>
    <div class="list top">${cards}</div>`;
}
function progZoneCard(z,r){
  const bar=(pct,c)=>`<div style="flex:1"><div style="height:6px;background:#eef2f7;border-radius:3px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${c}"></div></div></div>`;
  return `<div class="pzcard">
    <div class="pz-head"><span class="pz-name">${esc(z.name)}</span><span class="pz-sub">${z.total}대</span><span class="pz-pct">${r.pct}%</span></div>
    <div class="pz-bars">${bar((r.zIn/z.total*100).toFixed(0),'#1D5BA6')}${bar((r.zAn/z.total*100).toFixed(0),'#4aa3df')}${bar(r.instBarPct,'#2e7d32')}${bar((r.zChk/z.total*100).toFixed(0),'#7c3aed')}</div>
    <div class="pz-lab"><span>반입 ${r.zIn}/${z.total}</span><span>입고검사 ${r.zAn}/${z.total}</span><span>설치 ${r.instDone}/${z.total}</span><span>시공검측 ${r.zChk}/${z.total}</span></div>
  </div>`;
}
function renderCalendar(s){
  const scheds=data[s.sch]||[];
  const byDate={}; scheds.forEach(x=>{const d=fmtDate(x.sdate); if(d)(byDate[d]=byDate[d]||[]).push(x);});
  const [y,m]=calMonth.split('-').map(Number);
  const startDay=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const td=todayStr();
  let head=WD.map((w,i)=>`<div style="text-align:center;font-size:11px;font-weight:700;color:${i===0?'#c0392b':i===6?'#1D5BA6':'#9aa8bc'};padding:4px 0">${w}</div>`).join('');
  let cells='';
  for(let i=0;i<startDay;i++) cells+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=!!byDate[ds]; const sel=ds===selectedDate; const isToday=ds===td;
    const dow=new Date(y,m-1,d).getDay();
    const col=sel?'#fff':(dow===0?'#c0392b':dow===6?'#1D5BA6':'#1a2330');
    const bg=sel?'#1b8a5a':(isToday?'#e7f5ee':'transparent');
    cells+=`<div onclick="selectDate('${ds}')" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:11px;background:${bg};color:${col};font-size:13.5px;font-weight:${sel||isToday?'800':'600'};position:relative">
      ${d}${has?`<span style="position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:${sel?'#fff':'#1b8a5a'}"></span>`:''}</div>`;
  }
  const dayItems=(byDate[selectedDate]||[]).sort((a,b)=>(a.stime||'').localeCompare(b.stime||''));
  const [sy,sm,sd]=selectedDate.split('-');
  const selLabel=`${sm}월 ${sd}일 (${WD[new Date(sy,sm-1,sd).getDay()]})`;
  // 업무지시/보고: 해당 날짜 문서(id===selectedDate)
  const rep=(data[s.rep]||[]).find(r=>r.id===selectedDate);
  let repHtml='';
  if(rep){
    const ins=(rep.instruction||'').trim();
    const brf=(rep.briefText||rep.content||'').trim();
    if(ins) repHtml+=`<div class="rep-item"><div class="rep-head"><span class="rtag ins">지시</span><span class="rep-pjt">${esc(s.code)}</span></div><div class="rep-text">${esc(ins)}</div></div>`;
    if(brf) repHtml+=`<div class="rep-item"><div class="rep-head"><span class="rtag brf">보고</span><span class="rep-pjt">${esc(s.code)}</span></div><div class="rep-text">${esc(brf)}</div></div>`;
  }
  return `
    <div style="margin:14px 20px 0;background:#fff;border:1px solid #e4eaf2;border-radius:18px;padding:14px 14px 16px;box-shadow:0 2px 8px rgba(30,50,80,.05)">
      <div style="display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px">
        <button onclick="shiftCalMonth(-1)" style="background:#f0f4f9;border:1px solid #e4eaf2;border-radius:9px;width:32px;height:32px;font-size:16px;color:#5c6f8a;cursor:pointer">‹</button>
        <div style="font-size:16px;font-weight:800;color:#16487f;min-width:104px;text-align:center">${y}년 ${m}월</div>
        <button onclick="shiftCalMonth(1)" style="background:#f0f4f9;border:1px solid #e4eaf2;border-radius:9px;width:32px;height:32px;font-size:16px;color:#5c6f8a;cursor:pointer">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr)">${head}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:2px">${cells}</div>
    </div>
    <div class="lbl">📅 ${selLabel} 일정 ${dayItems.length?`(${dayItems.length})`:''}</div>
    ${dayItems.length?`<div class="list">${dayItems.map(schCard).join('')}</div>`:'<div class="empty">이 날 등록된 일정이 없습니다.</div>'}
    <div class="divider"></div>
    <div class="lbl">📋 업무지시 · 보고</div>
    ${repHtml?`<div class="list">${repHtml}</div>`:'<div class="empty">이 날 입력된 지시·보고가 없습니다.</div>'}`;
}
function schCard(s){
  return `<div class="schcard" onclick="openSched('${s.id}')">
    <div class="sch-time">${s.stime?esc(s.stime):'종일'}</div>
    <div class="sch-body"><div class="sch-text">${esc(s.text||s.title||'(내용 없음)')}</div>${s.pjtName?`<div class="sch-meta">${esc(s.pjtName)}</div>`:''}</div>
    ${tagChip(s.tag)}<span class="sch-go">›</span></div>`;
}
function renderSchedDetail(){
  const s=SITES[site]; if(!s){ renderHome(); return; }
  const sch=(data[s.sch]||[]).find(x=>x.id===detailId);
  if(!sch){ $app().innerHTML=topBar('일정','goBack()')+'<div class="empty">일정을 찾을 수 없습니다.</div>'; return; }
  const info=[['날짜',fmtDate(sch.sdate)],['시간',sch.stime||'종일'],['구분',sch.tag&&TAGS[sch.tag]?TAGS[sch.tag].l:(sch.tag||'')],['PJT',sch.pjtName],['담당/역할',sch.role],['등록자',sch.author||sch.writer]].filter(x=>x[1]);
  $app().innerHTML=topBar('일정','goBack()')+`
    <div class="hello"><div class="name" style="font-size:20px;color:var(--ink)">${esc(sch.text||sch.title||'일정')}</div><div class="sub">${esc(s.code)} · ${esc(fmtDate(sch.sdate))}</div></div>
    <div class="dcard">${info.map(([k,v])=>`<div class="drow"><span class="dk">${k}</span><span class="dv">${esc(v)}</span></div>`).join('')}</div>
    ${sch.memo||sch.detail||sch.note?`<div class="lbl">상세 내용</div><div class="dcard"><div class="drow"><span class="dv" style="text-align:left;max-width:100%">${esc(sch.memo||sch.detail||sch.note)}</span></div></div>`:''}`;
}

function subscribe(coll){
  onSnapshot(collection(db,coll), snap=>{ const arr=[]; snap.forEach(d=>arr.push({id:d.id,...d.data()})); data[coll]=arr; render(); },
    err=>{ loadError=err.code||err.message; render(); });
}
['user_schedules','ph4_schedules','daily_report_docs','ph4_reports'].forEach(subscribe);

history.replaceState({v:'home',site:null,sub:'sched'},'');
render();
</script>
