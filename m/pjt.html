<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJT 관리 · JH Solutions</title>
<style>
  :root{--blue:#1D5BA6;--blue-d:#16487f;--ink:#1a2330;--sub:#6b7787;--line:#e4eaf2;--bg:#eef2f7;--card:#fff;--ok:#1b8a5a;--warn:#c0392b;--amber:#e08a1e;--violet:#7C3AED}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
  .phone{width:100%;max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh}
  .scr{padding:0 0 30px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 4px}
  .back{background:var(--card);border:1px solid var(--line);color:var(--blue);font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;cursor:pointer;font-family:inherit;box-shadow:0 2px 6px rgba(30,50,80,.05)}
  .back:active{background:#f0f4f9}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 4px 10px rgba(29,91,166,.3);cursor:pointer}
  .hello{padding:18px 24px 6px}
  .hello .name{font-size:25px;font-weight:800;letter-spacing:-.5px;color:var(--ok)}
  .hello .sub{font-size:12.5px;color:var(--sub);margin-top:4px;font-weight:600}
  .lbl{font-size:12px;font-weight:800;color:#9aa8bc;letter-spacing:.5px;padding:22px 24px 12px}
  .list{padding:0 20px;display:flex;flex-direction:column;gap:14px}
  .list.top{padding-top:16px}
  .fcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;cursor:pointer;transition:transform .12s ease;box-shadow:0 2px 8px rgba(30,50,80,.05);display:flex;align-items:center;gap:15px}
  .fcard:active{transform:scale(.98)}
  .fcard .ic{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
  .fcard.fab .ic{background:#e7f5ee;color:#1b8a5a}.fcard.sup .ic{background:#eaf2fc;color:#1D5BA6}
  .fcard .cl{font-size:12px;font-weight:700;color:var(--sub)}
  .fcard .nm{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:2px}
  .fcard .ds{font-size:11.5px;color:var(--sub);font-weight:500;margin-top:3px}
  .fcard .go{margin-left:auto;font-size:18px;color:#c3cedd;flex-shrink:0}
  .segs{display:flex;gap:8px;margin:14px 20px 0}
  .seg{flex:1;padding:11px;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--sub)}
  .seg.on{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 4px 10px rgba(27,138,90,.25)}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(30,50,80,.05)}
  .ic-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .ic-date{font-size:12px;font-weight:800;color:var(--blue-d);white-space:nowrap}
  .tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:#e7f5ee;color:#1b8a5a;white-space:nowrap}
  .ic-text{font-size:14px;font-weight:700;margin-top:6px}
  .ic-meta{font-size:11.5px;color:var(--sub);font-weight:500;margin-top:4px}
  .empty{margin:20px 20px 0;padding:24px;text-align:center;color:#9aa8bc;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:16px}
  .loading{text-align:center;padding:40px;color:#9aa8bc;font-size:13px;font-weight:600}
  .banner{margin:14px 20px 0;padding:11px 14px;border-radius:12px;font-size:11.5px;font-weight:600;line-height:1.5}
  .banner.err{background:#fdecea;border:1px solid #f5c6c0;color:#a5342a}
  .banner.soft{background:#f4f6f9;border:1px solid var(--line);color:var(--sub)}
</style>
</head>
<body>
  <div class="phone"><div id="app" class="scr"><div class="loading">불러오는 중…</div></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey:"AIzaSyCyQxBJ_ftfM0ImBXubmqD5gfzFR54iPmE", authDomain:"p4ph2-fab-506a7.firebaseapp.com",
  projectId:"p4ph2-fab-506a7", storageBucket:"p4ph2-fab-506a7.firebasestorage.app",
  messagingSenderId:"36946317914", appId:"1:36946317914:web:c6ad5f3a1b98130c99fe63"
};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);

const SITES={
  fab:{code:'P4 Ph2 (FAB)',client:'귀뚜라미범양냉방',desc:'FCU 설치 · 6섹터 183대',ic:'🏭',cls:'fab',sch:'user_schedules'},
  sup:{code:'P4 Ph4 (SUP)',client:'귀뚜라미범양냉방',desc:'EHU 설치 · 4섹터 11대',ic:'🔧',cls:'sup',sch:'ph4_schedules'},
};
let data={user_schedules:[],ph4_schedules:[]};
let curView='home', site=null, sub='sched', loadError='';
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
let selectedDate=todayStr(), calMonth=todayStr().slice(0,7);

const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $app=()=>document.getElementById('app');
const fmtDate=v=>{if(!v)return '';if(v.seconds)return new Date(v.seconds*1000).toISOString().slice(0,10);return String(v).slice(0,10);};
const WD=['일','월','화','수','목','금','토'];

function nav(v,s){ curView=v; if(s!==undefined)site=s; history.pushState({v,site,sub},''); render(); window.scrollTo(0,0); }
window.openSite=function(s){ site=s; sub='sched'; selectedDate=todayStr(); calMonth=todayStr().slice(0,7); nav('site',s); };
window.setSub=function(t){ sub=t; if(t==='sched'){ selectedDate=todayStr(); calMonth=todayStr().slice(0,7); } render(); };
window.selectDate=function(d){ selectedDate=d; render(); };
window.shiftCalMonth=function(delta){ const [y,m]=calMonth.split('-').map(Number); const nm=new Date(y,m-1+delta,1); calMonth=nm.getFullYear()+'-'+String(nm.getMonth()+1).padStart(2,'0'); render(); };
window.goBack=function(){ history.back(); };
window.goHome=function(){ location.href='home.html'; };
window.goAccount=function(){ location.href='account.html'; };
window.addEventListener('popstate',e=>{ const st=e.state||{v:'home',site:null,sub:'sched'}; curView=st.v; site=st.site; sub=st.sub||'sched'; render(); window.scrollTo(0,0); });

function render(){
  if(loadError){ $app().innerHTML=topBar('홈','goHome()')+`<div class="banner err">데이터를 불러오지 못했습니다: ${esc(loadError)}<br>포털 로그인 세션이 필요할 수 있습니다.</div>`; return; }
  if(curView==='site') return renderSite();
  renderHome();
}
function topBar(label,onclick){ return `<div class="top"><button class="back" onclick="${onclick||'goBack()'}">← ${label}</button><div class="avatar" onclick="goAccount()">김</div></div>`; }

function renderHome(){
  $app().innerHTML=`
    <div class="top"><button class="back" onclick="goHome()">← 홈</button><div class="avatar" onclick="goAccount()">김</div></div>
    <div class="hello"><div class="name">PJT 관리</div><div class="sub">진행 중인 프로젝트 현장 관리</div></div>
    <div class="lbl">진행 프로젝트</div>
    <div class="list top">
      ${Object.entries(SITES).map(([k,s])=>`<div class="fcard ${s.cls}" onclick="openSite('${k}')">
        <div class="ic">${s.ic}</div>
        <div><div class="cl">${esc(s.client)}</div><div class="nm">${esc(s.code)}</div><div class="ds">${esc(s.desc)} · 공정·일정·근태</div></div>
        <span class="go">›</span></div>`).join('')}
    </div>`;
}

function renderSite(){
  const s=SITES[site]; if(!s){ renderHome(); return; }
  const scheds=data[s.sch]||[];
  let body='';
  if(sub==='sched') body=renderCalendar(scheds);
  else if(sub==='progress') body='<div class="banner soft">공정 진척은 섹터별·날짜별 데이터라 정확히 붙이는 중입니다. 곧 제공됩니다.</div><div class="empty">준비 중</div>';
  else body='<div class="banner soft">근태(출역·공수) 데이터를 붙이는 중입니다. 곧 제공됩니다.</div><div class="empty">준비 중</div>';
  $app().innerHTML=topBar('PJT','goBack()')+`
    <div class="hello"><div class="name" style="font-size:21px;color:var(--ink)">${esc(s.code)}</div><div class="sub">${esc(s.client)} · ${esc(s.desc)}</div></div>
    <div class="segs">
      <div class="seg ${sub==='progress'?'on':''}" onclick="setSub('progress')">공정</div>
      <div class="seg ${sub==='sched'?'on':''}" onclick="setSub('sched')">일정</div>
      <div class="seg ${sub==='attend'?'on':''}" onclick="setSub('attend')">근태</div>
    </div>
    ${body}`;
}

function renderCalendar(scheds){
  const byDate={}; scheds.forEach(x=>{const d=fmtDate(x.sdate); if(d)(byDate[d]=byDate[d]||[]).push(x);});
  const [y,m]=calMonth.split('-').map(Number);
  const startDay=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const td=todayStr();
  // 요일 헤더
  let head=WD.map((w,i)=>`<div style="text-align:center;font-size:11px;font-weight:700;color:${i===0?'#c0392b':i===6?'#1D5BA6':'#9aa8bc'};padding:4px 0">${w}</div>`).join('');
  // 날짜 셀
  let cells='';
  for(let i=0;i<startDay;i++) cells+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=!!byDate[ds]; const sel=ds===selectedDate; const isToday=ds===td;
    const dow=new Date(y,m-1,d).getDay();
    const col=sel?'#fff':(dow===0?'#c0392b':dow===6?'#1D5BA6':'#1a2330');
    const bg=sel?'#1b8a5a':(isToday?'#e7f5ee':'transparent');
    cells+=`<div onclick="selectDate('${ds}')" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:11px;background:${bg};color:${col};font-size:13.5px;font-weight:${sel||isToday?'800':'600'};position:relative">
      ${d}${has?`<span style="position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:${sel?'#fff':'#1b8a5a'}"></span>`:''}</div>`;
  }
  const dayItems=(byDate[selectedDate]||[]).sort((a,b)=>(a.stime||'').localeCompare(b.stime||''));
  const [sy,sm,sd]=selectedDate.split('-');
  const selLabel=`${sm}월 ${sd}일 (${WD[new Date(sy,sm-1,sd).getDay()]})`;
  return `
    <div style="margin:14px 20px 0;background:#fff;border:1px solid #e4eaf2;border-radius:18px;padding:14px 14px 16px;box-shadow:0 2px 8px rgba(30,50,80,.05)">
      <div style="display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px">
        <button onclick="shiftCalMonth(-1)" style="background:#f0f4f9;border:1px solid #e4eaf2;border-radius:9px;width:32px;height:32px;font-size:16px;color:#5c6f8a;cursor:pointer">‹</button>
        <div style="font-size:16px;font-weight:800;color:#16487f;min-width:104px;text-align:center">${y}년 ${m}월</div>
        <button onclick="shiftCalMonth(1)" style="background:#f0f4f9;border:1px solid #e4eaf2;border-radius:9px;width:32px;height:32px;font-size:16px;color:#5c6f8a;cursor:pointer">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr)">${head}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:2px">${cells}</div>
    </div>
    <div class="lbl">${selLabel} 일정 ${dayItems.length?`(${dayItems.length})`:''}</div>
    ${dayItems.length?`<div class="list">${dayItems.map(schCard).join('')}</div>`:'<div class="empty">이 날 등록된 일정이 없습니다.</div>'}`;
}
function schCard(s){
  return `<div class="icard"><div class="ic-top"><span class="ic-date">${s.stime?esc(s.stime):'종일'}</span>${s.tag?`<span class="tag">${esc(s.tag)}</span>`:''}</div>
    <div class="ic-text">${esc(s.text||s.title||'(내용 없음)')}</div>
    ${s.pjtName||s.role?`<div class="ic-meta">${esc(s.pjtName||'')}${s.role?' · '+esc(s.role):''}</div>`:''}</div>`;
}

function subscribe(coll){
  onSnapshot(collection(db,coll), snap=>{ const arr=[]; snap.forEach(d=>arr.push({id:d.id,...d.data()})); data[coll]=arr; render(); },
    err=>{ loadError=err.code||err.message; render(); });
}
['user_schedules','ph4_schedules'].forEach(subscribe);

history.replaceState({v:'home',site:null,sub:'sched'},'');
render();
</script>
</body>
</html>
