<!DOCTYPE html><!-- 일회성 관리자 도구 · 2026-09-03 · 퇴사자 공수 오염 데이터 정리 (김혁·미첼·민지환·정대웅) · 사용 후 삭제 예정 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>공수 데이터 정리 도구</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;background:#f5f5f7;color:#1A2540;margin:0;padding:24px;max-width:820px;margin:0 auto}
  h1{font-size:18px;margin:16px 0 4px}
  .sub{color:#86868b;font-size:13px;margin-bottom:20px}
  .card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px;margin-bottom:16px}
  button{font-size:14px;font-weight:600;padding:10px 18px;border-radius:10px;border:1px solid #1D5BA6;background:#1D5BA6;color:#fff;cursor:pointer;margin-right:8px}
  button.danger{border-color:#c0392b;background:#c0392b}
  button:disabled{opacity:.4;cursor:not-allowed}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eee}
  th{color:#86868b;font-weight:600}
  #status{font-size:13px;color:#86868b;margin-top:10px;white-space:pre-wrap;line-height:1.6}
  .badge{display:inline-block;padding:2px 8px;border-radius:8px;background:#f2f2f2;color:#888;font-size:11px;margin-left:6px}
</style>
</head>
<body>
  <h1>🧹 퇴사자 공수 오염 데이터 정리</h1>
  <div class="sub">대상: 김혁 · 미첼 · 민지환 · 정대웅 (FAB · worker_manday) — 관리자 전용 일회성 도구</div>

  <div id="gate" class="card">로그인 확인 중...</div>

  <div id="tool" class="card" style="display:none">
    <button id="scanBtn" onclick="scan()">🔍 조회 (삭제 안 함)</button>
    <button id="applyBtn" class="danger" onclick="applyCleanup()" disabled>🗑 실제 삭제 실행</button>
    <div id="status"></div>
    <div id="tableWrap"></div>
  </div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteField }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyCyQxBJ_ftfM0ImBXubmqD5gfzFR54iPmE",
  authDomain: "p4ph2-fab-506a7.firebaseapp.com",
  projectId: "p4ph2-fab-506a7",
  storageBucket: "p4ph2-fab-506a7.firebasestorage.app",
  messagingSenderId: "36946317914",
  appId: "1:36946317914:web:c6ad5f3a1b98130c99fe63"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
window._db = db;

const TARGET_NAMES = ['김혁','미첼','민지환','정대웅'];
let plan = [];

const gateEl = document.getElementById('gate');
const toolEl = document.getElementById('tool');
const statusEl = document.getElementById('status');
const tableWrap = document.getElementById('tableWrap');

onAuthStateChanged(auth, async (user) => {
  if(!user){
    gateEl.innerHTML = '🔒 로그인이 필요합니다. <a href="https://portal.jhsol.kr/">portal.jhsol.kr</a>에서 먼저 로그인한 뒤, 이 페이지를 새로고침 해주세요.';
    return;
  }
  try{
    const uSnap = await getDoc(doc(db,'portal_users',user.uid));
    const uData = uSnap.exists() ? uSnap.data() : null;
    const ok = !!(uData && uData.status==='approved' && (uData.admin===true || (uData.perms && uData.perms.pjt===true)));
    if(!ok){ gateEl.innerHTML='🔒 PJT 관리 권한이 없는 계정입니다.'; return; }
    gateEl.style.display='none';
    toolEl.style.display='block';
  }catch(e){ gateEl.innerHTML='오류: '+e.message; }
});

function toKey(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }

window.scan = async function(){
  const scanBtn=document.getElementById('scanBtn'), applyBtn=document.getElementById('applyBtn');
  scanBtn.disabled=true; applyBtn.disabled=true;
  statusEl.textContent='조회 중...'; tableWrap.innerHTML=''; plan=[];
  try{
    const mwSnap = await getDocs(collection(db,'master_workers'));
    const targets=[];
    mwSnap.forEach(d=>{
      const data=d.data();
      if(TARGET_NAMES.includes(data.name) && data.resigned && data.resignedDate){
        targets.push({ id:d.id, name:data.name, resignedDate:data.resignedDate });
      }
    });
    if(targets.length===0){ statusEl.textContent='❌ 대상 인원을 마스터 명부에서 찾지 못했습니다.'; scanBtn.disabled=false; return; }
    if(targets.length < TARGET_NAMES.length){
      statusEl.textContent='⚠️ '+targets.length+'/'+TARGET_NAMES.length+'명만 조회됨: '+targets.map(t=>t.name).join(', ');
    }

    const today=new Date(); today.setHours(0,0,0,0);
    for(const t of targets){
      const start=new Date(t.resignedDate+'T00:00:00');
      start.setDate(start.getDate()+1); // 퇴사 다음날부터
      for(let d=new Date(start); d<=today; d.setDate(d.getDate()+1)){
        const key=toKey(d);
        const snap=await getDoc(doc(db,'worker_manday',key));
        if(snap.exists()){
          const md=snap.data().md||{};
          if(md[t.id]!==undefined){
            plan.push({ dateKey:key, workerId:t.id, name:t.name, resignedDate:t.resignedDate, value:md[t.id] });
          }
        }
      }
    }

    if(plan.length===0){
      statusEl.textContent='✅ 정리할 오염 데이터가 없습니다. (모두 정상)';
    } else {
      statusEl.textContent = plan.length+'건 발견. 아래 표를 확인한 뒤 "실제 삭제 실행"을 눌러주세요.';
      let html='<table><thead><tr><th>이름</th><th>퇴사일</th><th>공수 찍힌 날짜</th><th>값</th></tr></thead><tbody>';
      plan.forEach(p=>{ html+='<tr><td>'+p.name+'</td><td>'+p.resignedDate+'</td><td>'+p.dateKey+'</td><td>'+p.value+'</td></tr>'; });
      html+='</tbody></table>';
      tableWrap.innerHTML=html;
      applyBtn.disabled=false;
    }
  }catch(e){ statusEl.textContent='오류: '+e.message; }
  scanBtn.disabled=false;
};

window.applyCleanup = async function(){
  if(!plan.length) return;
  if(!confirm(plan.length+'건을 실제로 삭제합니다. 되돌릴 수 없습니다. 계속할까요?')) return;
  const applyBtn=document.getElementById('applyBtn');
  applyBtn.disabled=true;
  let done=0;
  for(const item of plan){
    try{
      const ref=doc(db,'worker_manday',item.dateKey);
      const updateObj={}; updateObj['md.'+item.workerId]=deleteField();
      await updateDoc(ref, updateObj);
      done++;
      statusEl.textContent='삭제 중... ('+done+'/'+plan.length+') 최근: '+item.name+' '+item.dateKey;
    }catch(e){ statusEl.textContent='오류 발생 ('+item.name+' '+item.dateKey+'): '+e.message; return; }
  }
  statusEl.textContent='🎉 완료: 총 '+done+'건 삭제했습니다. 이 페이지는 이제 닫으셔도 됩니다.';
  tableWrap.innerHTML='';
  plan=[];
};
</script>
</body>
</html>
