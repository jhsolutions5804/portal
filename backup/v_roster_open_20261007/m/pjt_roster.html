<!DOCTYPE html><!-- 모바일 근로자 연명부 v1.2.0 · 정렬(이름·입사일·검진 만료·교육·자격·첨부, 오름/내림) · 2026-09-30 · 관리자 전용 조회 + 신규 등록·수정(PC와 같은 화면)·퇴사처리·검진 결과 PDF 다운로드/첨부 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근로자 연명부 · JH Solutions</title>
<style>
  :root{--blue:#1D5BA6;--ink:#1a2330;--sub:#6b7787;--line:#e4eaf2;--bg:#eef2f7;--card:#fff;--ok:#1b8a5a;--warn:#c0392b;--amber:#e08a1e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
  .phone{width:100%;max-width:520px;margin:0 auto;min-height:100vh}
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
  .back{background:var(--card);border:1px solid var(--line);color:var(--blue);font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;cursor:pointer;font-family:inherit}
  .ttl{font-size:20px;font-weight:800;padding:8px 20px 2px}
  .ttl small{font-size:11.5px;color:var(--sub);font-weight:600;margin-left:6px}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px 0}
  .sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
  .sc .n{font-size:20px;font-weight:800}.sc .n.warn{color:var(--warn)}.sc .k{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:2px;line-height:1.3}
  .search{margin:12px 16px 0;display:flex;gap:8px}
  .search input{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;font-family:inherit;background:#fff;min-width:0}
  .tabs{display:flex;gap:6px;margin:10px 16px 0}
  .tab{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .sortbar{display:flex;align-items:center;gap:8px;margin:10px 16px 0;font-size:12px;font-weight:700;color:var(--sub)}
  .sortbar select{flex:1;min-width:0;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-family:inherit;color:var(--ink)}
  .sdir{padding:8px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;font-weight:700;color:var(--blue);font-family:inherit;white-space:nowrap;cursor:pointer}
  .list{padding:12px 16px 30px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer}
  .card:active{transform:scale(.985)}
  .row1{display:flex;align-items:center;gap:11px}
  .av{width:40px;height:40px;border-radius:50%;background:#eaf2fc;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
  .nm{font-size:15.5px;font-weight:800}.meta{font-size:11.5px;color:var(--sub);font-weight:500;margin-top:1px}
  .go{margin-left:auto;color:#c3cedd;font-size:16px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .b{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:#f1f4f8;color:#5b6878;white-space:nowrap}
  .b.ok{background:#e7f5ee;color:var(--ok)}.b.soon{background:#fff1dc;color:#b86a00}.b.exp{background:#fde8e6;color:var(--warn)}.b.off{background:#f1f4f8;color:#9aa8bc}
  .empty,.loading,.err{margin:24px 16px;padding:24px;text-align:center;color:#9aa8bc;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:16px}
  .err{color:var(--warn)}
  .sec{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .sec h3{font-size:13px;font-weight:800;margin-bottom:8px;color:#333}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #eef0f3;font-size:13px}
  .kv:last-child{border-bottom:none}.kv .k{color:var(--sub);font-weight:600;flex-shrink:0}.kv .v{font-weight:600;text-align:right;word-break:break-all}
  .item{padding:9px 0;border-bottom:1px dashed #eef0f3}.item:last-child{border-bottom:none}
  .item .t{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .item .s{font-size:11.5px;color:var(--sub);margin-top:3px}
  .btn{display:inline-block;margin-top:7px;padding:8px 13px;border-radius:10px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn:disabled{opacity:.5}
  .note{margin:14px 20px 26px;font-size:11.5px;color:#9aa8bc;font-weight:600;text-align:center}
  a.tel{color:var(--blue);text-decoration:none}
  .pri{background:var(--blue);color:#fff;border-color:var(--blue)}
  .top .back.pri{padding:8px 16px}
  .acts{display:flex;gap:8px;margin:12px 16px 0}
  .acts .btn{flex:1;margin-top:0;padding:11px 0;font-size:14px;text-align:center}
  .btn.warn{border-color:#e0a800;color:#9a5a00}
  .btn.ok2{border-color:var(--ok);color:var(--ok)}
</style>
</head>
<body>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getStorage, ref as sref, getBlob } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
const firebaseConfig = {
  apiKey:"AIzaSyCyQxBJ_ftfM0ImBXubmqD5gfzFR54iPmE", authDomain:"p4ph2-fab-506a7.firebaseapp.com",
  projectId:"p4ph2-fab-506a7", storageBucket:"p4ph2-fab-506a7.firebasestorage.app",
  messagingSenderId:"36946317914", appId:"1:36946317914:web:c6ad5f3a1b98130c99fe63"
};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app); const storage=getStorage(app);

const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $app=()=>document.getElementById('app');
const p2=n=>String(n).padStart(2,'0');
const ymdToday=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
const EDU=[{k:'e1',l:'안전담당자/화재감시자 기본 인증'},{k:'e2',l:'중량물/양중작업 안전인증'},{k:'e3',l:'화학물질취급작업 안전인증'},{k:'e4',l:'화학물질안전원 온라인 교육'}];
const EDU_SK=[{k:'s1',l:'기본안전교육(자율책임작업 등)'},{k:'s2',l:'기본안전교육(A~D급)'},{k:'s3',l:'신호수/중량물 교육'},{k:'s4',l:'안전Leaders 교육'},{k:'s5',l:'화학물질취급 교육'}];
const CHEM_REQ=2;   // 화학물질안전원 종사자 교육과정 — 연 2시간
function chemSum(p,y){ let s=0; ((p&&p.chemEdu)||[]).forEach(r=>{ const h=parseFloat(r.hours); const mm=/^(\d{4})-/.exec(r.date||''); if(h>0&&mm&&+mm[1]===y) s+=h; }); return s; }
const HEALTH_TYPES={general:'일반검진',preplace:'배치전검진'};
const CO={samsung:'삼성전자',skhynix:'SK하이닉스'}; const certCo=c=>(c&&c.co)||'samsung';
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round((n||0)/1024))+'KB';
const maskJumin=j=>{const d=String(j||'').replace(/[^0-9]/g,'');return d.length===13?d.slice(0,6)+'-'+d[6]+'······':'—';};

// 만료 계산(PC 연명부와 같은 규칙): 검진 만료일 = 저장된 만료일, 없으면 실시일 + 1년
function addYearsYmd(ymd,n){ if(!/^\d{4}-\d{2}-\d{2}$/.test(ymd||'')) return ''; const y=+ymd.slice(0,4),m=+ymd.slice(5,7),d=+ymd.slice(8,10); if(y<1900||y>2100) return '';
  const dt=new Date(Date.UTC(y+n,m-1,d)); if(dt.getUTCMonth()!==m-1) dt.setUTCDate(0); return dt.getUTCFullYear()+'-'+p2(dt.getUTCMonth()+1)+'-'+p2(dt.getUTCDate()); }
function dday(exp){ if(!exp) return null; return Math.round((new Date(exp+'T00:00:00')-new Date(ymdToday()+'T00:00:00'))/86400000); }
function stateOf(exp){ const d=dday(exp); if(d===null) return {cls:'off',txt:'—',d:null}; if(d<0) return {cls:'exp',txt:'만료 D+'+Math.abs(d),d}; if(d<=30) return {cls:'soon',txt:'D-'+d,d}; return {cls:'ok',txt:'유효 D-'+d,d}; }
function latestHealth(p,type){ const l=((p&&p.health)||[]).filter(h=>h.type===type&&h.date).sort((a,b)=>a.date.localeCompare(b.date)); return l.length?l[l.length-1]:null; }
function healthExpiry(p,type){ const h=latestHealth(p,type); return h?(h.expiry||addYearsYmd(h.date,1)):''; }
function eduOn(p,k){ return !!((p&&p.inhouseEdu)||{})[k]; }
function eduExp(p,k){ return ((p&&p.inhouseEduExp)||{})[k]||''; }

let masters=[], privs={}, tab='act', q='', view='list', detailId=null, loadError='';
let sortKey='', sortDir=1;      // 정렬: '' = 기본(팀장·팀별·이름), sortDir 1 오름차순 / -1 내림차순
const SORTS=[['','기본 순서'],['name','이름'],['gender','성별'],['hire','입사일'],['phone','전화번호'],['team','소속'],['general','일반검진 만료'],['preplace','배치전검진 만료'],['edu','사내화 교육 이수'],['cert','자격·인증 수'],['files','첨부 등록 수']];
function sortVal(m){
  const p=privs[m.id]||{};
  switch(sortKey){
    case 'name': return m.name||'';
    case 'gender': return m.gender||'';
    case 'phone': return String(p.phone||'').replace(/[^0-9]/g,'');
    case 'hire': return m.hireDate||'';
    case 'team': { const l=m.leaderId?byId(m.leaderId):null; return m.leaderId?'1'+(l?l.name:''):'0'; }
    case 'general': return healthExpiry(p,'general')||'';
    case 'preplace': return healthExpiry(p,'preplace')||'';
    case 'edu': return EDU.filter(e=>eduOn(p,e.k)).length*10 - Math.min(9,EDU.filter(e=>eduOn(p,e.k)&&stateOf(eduExp(p,e.k)).cls==='exp').length);
    case 'cert': return (p.certs||[]).length;
    case 'files': return ['photo','idcard','cert'].filter(k=>(p.files||{})[k]).length;
  }
  return '';
}
function sortList(list){
  const vals=new Map(list.map(m=>[m.id,sortVal(m)]));
  return list.sort((a,b)=>{
    const va=vals.get(a.id), vb=vals.get(b.id), ea=(va===''||va==null), eb=(vb===''||vb==null);
    if(ea!==eb) return ea?1:-1;                                   // 값이 없는 사람은 방향과 관계없이 항상 아래
    const c=(typeof va==='number'&&typeof vb==='number')?va-vb:String(va).localeCompare(String(vb),'ko');
    return c?c*sortDir:(a.name||'').localeCompare(b.name||'','ko');
  });
}
window.setSortKey=function(k){ sortKey=k; renderList(); };
window.toggleSortDir=function(){ sortDir=-sortDir; const b=document.getElementById('sortDir'); if(b) b.textContent=sortDir===1?'▲ 오름차순':'▼ 내림차순'; renderList(); };
const byId=id=>masters.find(m=>m.id===id);
const teamOf=m=>{ if(!m.leaderId) return '팀장/독립'; const l=byId(m.leaderId); return (l?l.name:'?')+' 팀'; };

function topBar(){ return '<div class="top"><button class="back" onclick="goBack()">← '+(view==='list'?'홈':'목록')+'</button>'+(view==='list'&&!loadError?'<button class="back pri" onclick="newWorker()">＋ 신규 등록</button>':'')+'</div>'; }
window.goBack=function(){ if(view==='list') location.href='home.html'; else history.back(); };
window.addEventListener('popstate',()=>{ view='list'; detailId=null; render(); });
window.openDetail=function(id){ view='detail'; detailId=id; history.pushState({v:'detail'},''); render(); window.scrollTo(0,0); };
window.newWorker=function(){ location.href='../pjt_roster/index.html?m=1&new=1'; };
window.editWorker=function(id){ location.href='../pjt_roster/index.html?m=1&edit='+encodeURIComponent(id); };
window.setTab=function(t){ tab=t; render(); };
window.setQ=function(v){ q=v; renderList(); };

function visible(){
  const s=q.trim().toLowerCase();
  const list=masters.filter(m=>tab==='all'?true:tab==='res'?!!m.resigned:!m.resigned).filter(m=>{
    if(!s) return true; const p=privs[m.id]||{};
    const hay=[m.name,p.phone,teamOf(m),(p.certs||[]).map(c=>c.name+' '+(c.site||'')).join(' ')].join(' ').toLowerCase(); return hay.includes(s);
  });
  if(sortKey) return sortList(list);
  return list.sort((a,b)=>{ const aL=!a.leaderId, bL=!b.leaderId; if(aL!==bL) return aL?-1:1; return (a.leaderId||'').localeCompare(b.leaderId||'')||(a.name||'').localeCompare(b.name||'','ko'); });
}
function healthChip(p,type){ const e=healthExpiry(p,type); const lbl=type==='general'?'일반':'배치전'; if(!e) return '<span class="b off">'+lbl+' 없음</span>'; const s=stateOf(e); return '<span class="b '+s.cls+'">'+lbl+' '+s.txt+'</span>'; }
function cardHtml(m){
  const p=privs[m.id]||{}; const edn=EDU.filter(e=>eduOn(p,e.k)).length;
  const edExp=EDU.filter(e=>eduOn(p,e.k)&&stateOf(eduExp(p,e.k)).cls==='exp').length, edSoon=EDU.filter(e=>eduOn(p,e.k)&&stateOf(eduExp(p,e.k)).cls==='soon').length;
  const cs=p.certs||[]; const cExp=cs.filter(c=>stateOf(c.expiry).cls==='exp').length, cSoon=cs.filter(c=>stateOf(c.expiry).cls==='soon').length;
  const hasPdf=(p.health||[]).some(h=>h.pdf);
  return '<div class="card" onclick="openDetail(\''+esc(m.id).replace(/'/g,"\\'")+'\')"><div class="row1"><div class="av">'+esc((m.name||'?').slice(0,1))+'</div>'
   +'<div style="min-width:0"><div class="nm">'+esc(m.name)+(m.resigned?' <span class="b off">퇴사 '+esc(m.resignedDate||'')+'</span>':'')+'</div><div class="meta">'+esc(teamOf(m))+' · 입사 '+esc(m.hireDate||'—')+'</div></div><span class="go">›</span></div>'
   +'<div class="chips">'+healthChip(p,'general')+healthChip(p,'preplace')
   +'<span class="b '+(edn===4?'ok':edn===0?'exp':'soon')+'">교육 '+edn+'/4</span>'+(edExp?'<span class="b exp">교육 만료 '+edExp+'</span>':edSoon?'<span class="b soon">교육 임박 '+edSoon+'</span>':'')
   +(cs.length?'<span class="b '+(cExp?'exp':cSoon?'soon':'ok')+'">자격 '+cs.length+(cExp?' · 만료 '+cExp:cSoon?' · 임박 '+cSoon:'')+'</span>':'')
   +(hasPdf?'<span class="b ok">📄 검진결과</span>':'')+'</div></div>';
}
function summaryHtml(){
  const act=masters.filter(m=>!m.resigned);
  const hAlert=act.filter(m=>['general','preplace'].some(t=>{const e=healthExpiry(privs[m.id],t); const c=stateOf(e).cls; return e&&(c==='exp'||c==='soon');})).length;
  const noGen=act.filter(m=>!latestHealth(privs[m.id],'general')).length;
  return '<div class="summary"><div class="sc"><div class="n">'+act.length+'</div><div class="k">재직 인원</div></div>'
   +'<div class="sc"><div class="n '+(hAlert?'warn':'')+'">'+hAlert+'</div><div class="k">검진 만료·임박(30일)</div></div>'
   +'<div class="sc"><div class="n '+(noGen?'warn':'')+'">'+noGen+'</div><div class="k">일반검진 기록 없음</div></div></div>';
}
function renderList(){
  const list=visible(); const el=document.getElementById('lst'); if(!el) return;
  el.innerHTML=list.length?list.map(cardHtml).join(''):'<div class="empty">조건에 맞는 근로자가 없습니다.</div>';
}
function renderListPage(){
  $app().innerHTML=topBar()+'<div class="ttl">👷 근로자 연명부<small>관리자 전용</small></div>'+summaryHtml()
   +'<div class="search"><input type="search" placeholder="이름 · 연락처 · 소속 · 자격 검색" value="'+esc(q)+'" oninput="setQ(this.value)"></div>'
   +'<div class="sortbar"><span>정렬</span><select onchange="setSortKey(this.value)">'+SORTS.map(o=>'<option value="'+o[0]+'"'+(sortKey===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select><button id="sortDir" class="sdir" onclick="toggleSortDir()">'+(sortDir===1?'▲ 오름차순':'▼ 내림차순')+'</button></div>'
   +'<div class="tabs"><div class="tab '+(tab==='act'?'on':'')+'" onclick="setTab(\'act\')">재직</div><div class="tab '+(tab==='res'?'on':'')+'" onclick="setTab(\'res\')">퇴사</div><div class="tab '+(tab==='all'?'on':'')+'" onclick="setTab(\'all\')">전체</div></div>'
   +'<div class="list" id="lst"></div><div class="note">수정·등록은 PC와 같은 화면으로 열립니다.</div>';
  renderList();
}
function badge(exp){ const s=stateOf(exp); return '<span class="b '+s.cls+'">'+s.txt+'</span>'; }
function renderDetail(){
  const m=byId(detailId); if(!m){ view='list'; return renderListPage(); } const p=privs[m.id]||{};
  const health=((p.health)||[]).filter(h=>h.date).sort((a,b)=>b.date.localeCompare(a.date));
  const certs=(p.certs||[]);
  const tel=(p.phone||'').replace(/[^0-9+]/g,'');
  let h='<div class="sec"><h3>👤 인적사항</h3>'
   +'<div class="kv"><span class="k">이름</span><span class="v">'+esc(m.name)+'</span></div>'
   +'<div class="kv"><span class="k">생년월일</span><span class="v">'+esc(m.birth||'—')+'</span></div>'
   +'<div class="kv"><span class="k">성별</span><span class="v">'+esc(m.gender||'—')+'</span></div>'
   +'<div class="kv"><span class="k">주민번호</span><span class="v">'+esc(maskJumin(p.jumin))+'</span></div>'
   +'<div class="kv"><span class="k">전화</span><span class="v">'+(tel?'<a class="tel" href="tel:'+esc(tel)+'">'+esc(p.phone)+'</a>':'—')+'</span></div>'
   +'<div class="kv"><span class="k">입사일</span><span class="v">'+esc(m.hireDate||'—')+'</span></div>'
   +'<div class="kv"><span class="k">소속</span><span class="v">'+esc(teamOf(m))+'</span></div>'
   +(m.resigned?'<div class="kv"><span class="k">퇴사</span><span class="v">'+esc(m.resignedDate||'')+'</span></div>':'')+'</div>';
  h+='<div class="sec"><h3>🩺 건강검진 이력</h3>'+(health.length?health.map((x,i)=>{
      const exp=x.expiry||addYearsYmd(x.date,1);
      return '<div class="item"><div class="t">'+esc(HEALTH_TYPES[x.type]||'검진')+' '+badge(exp)+(x.expiryManual?'<span class="b">수정됨</span>':'')+'</div>'
        +'<div class="s">실시 '+esc(x.date)+' · 만료 '+esc(exp)+'</div>'
        +(x.pdf?'<div class="s">📄 '+esc(x.pdf.name)+' · '+fmtSize(x.pdf.size)+'</div><button class="btn" onclick="dlPdf(this,\''+esc(m.id).replace(/'/g,"\\'")+'\','+i+')">결과 PDF 다운로드</button>':'')+'</div>';
    }).join(''):'<div class="s" style="color:#9aa8bc">등록된 검진 이력이 없습니다.</div>')+'</div>';
  h+='<div class="sec"><h3>📜 자격 · 인증</h3>'+(certs.length?certs.map(c=>'<div class="item"><div class="t">'+esc(c.name)+' '+badge(c.expiry)+'</div><div class="s">'+esc(CO[certCo(c)]||'')+(c.site?' · '+esc(c.site):'')+' · 취득 '+esc(c.acquired||'—')+' · 만료 '+esc(c.expiry||'—')+'</div></div>').join(''):'<div class="s" style="color:#9aa8bc">등록된 자격/인증이 없습니다.</div>')+'</div>';
  h+='<div class="sec"><h3>🎓 사내화 교육 (삼성전자)</h3>'+EDU.map(e=>{ const on=eduOn(p,e.k), ex=eduExp(p,e.k);
      return '<div class="item"><div class="t">'+(on?'✅':'⬜')+' '+esc(e.l)+' '+(on?(ex?badge(ex):'<span class="b ok">이수</span>'):'<span class="b off">미이수</span>')+'</div>'+(on&&ex?'<div class="s">만료 '+esc(ex)+'</div>':'')+'</div>'; }).join('')+'</div>';
  h+='<div class="sec"><h3>🎓 사내화 교육 (SK하이닉스)</h3>'+EDU_SK.map(e=>{ const on=eduOn(p,e.k), ex=eduExp(p,e.k);
      return '<div class="item"><div class="t">'+(on?'✅':'⬜')+' '+esc(e.l)+' '+(on?(ex?badge(ex):'<span class="b ok">이수</span>'):'<span class="b off">미이수</span>')+'</div>'+(on&&ex?'<div class="s">만료 '+esc(ex)+'</div>':'')+'</div>'; }).join('')+'</div>';
  { const y=new Date().getFullYear(), rows=((p&&p.chemEdu)||[]).map((r,ix)=>({r,ix})).sort((a,b)=>(b.r.date||'').localeCompare(a.r.date||'')), s=chemSum(p,y);
    h+='<div class="sec"><h3>🧪 화학물질안전원 종사자 교육 (연 '+CHEM_REQ+'시간)</h3><div class="item"><div class="t">'+y+'년 누계 '+(Math.round(s*100)/100)+'h / '+CHEM_REQ+'h '+(s>=CHEM_REQ?'<span class="b ok">이수</span>':'<span class="b soon">미이수</span>')+'</div></div>'
      +(rows.length?rows.map(({r,ix})=>'<div class="item"><div class="s">'+esc(r.date||'')+' · '+esc(String(r.hours))+'h'+(r.note?' · '+esc(r.note):'')+'</div>'+(r.pdf?'<div class="s">📄 '+esc(r.pdf.name)+' · '+fmtSize(r.pdf.size)+'</div><button class="btn" onclick="dlChemPdf(this,\''+esc(m.id).replace(/'/g,"\\'")+'\','+ix+')">수료증 PDF 다운로드</button>':'')+'</div>').join(''):'<div class="s" style="color:#9aa8bc">등록된 교육 이력이 없습니다.</div>')+'</div>'; }
  const fm=p.files||{}; const chips=[['photo','사진'],['idcard','신분증'],['cert','이수증']].map(([k,l])=>'<span class="b '+(fm[k]?'ok':'off')+'">'+l+(fm[k]?' 등록':' 없음')+'</span>').join(' ');
  h+='<div class="sec"><h3>📎 첨부</h3><div class="chips" style="margin-top:0">'+chips+'</div><div class="s" style="margin-top:8px;color:#9aa8bc">사진·신분증·이수증은 ✏️ 수정 화면에서 확인·등록합니다.</div></div>';
  const acts='<div class="acts"><button class="btn pri" onclick="editWorker(\''+esc(m.id).replace(/'/g,"\\'")+'\')">✏️ 수정</button>'
    +(m.resigned?'<button class="btn ok2" onclick="toggleResign(\''+esc(m.id).replace(/'/g,"\\'")+'\')">재직 전환</button>':'<button class="btn warn" onclick="toggleResign(\''+esc(m.id).replace(/'/g,"\\'")+'\')">퇴사처리</button>')+'</div>';
  $app().innerHTML=topBar()+'<div class="ttl">'+esc(m.name)+'<small>'+esc(teamOf(m))+'</small></div>'+acts+h;
}
// 퇴사처리 / 재직 전환 — PC 연명부와 같은 규칙(master_workers.resigned·resignedDate)
window.toggleResign=async function(id){
  const m=byId(id); if(!m) return;
  try{
    if(m.resigned){
      if(!confirm(m.name+'님을 재직 상태로 전환할까요?')) return;
      await setDoc(doc(db,'master_workers',id),{resigned:false,resignedDate:null},{merge:true});
    }else{
      if(masters.some(x=>x.leaderId===id && !x.resigned)){ alert(m.name+'님은 팀장으로 지정된 인원이 있어 퇴사처리할 수 없습니다. 먼저 팀원들의 소속을 변경해주세요.'); return; }
      const input=prompt(m.name+'님의 퇴사일을 입력하세요. (YYYY-MM-DD)',ymdToday());
      if(input===null) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(input)){ alert('날짜 형식은 YYYY-MM-DD 로 입력하세요.'); return; }
      await setDoc(doc(db,'master_workers',id),{resigned:true,resignedDate:input},{merge:true});
    }
    await load(); view='detail'; detailId=id; render();
  }catch(e){ alert('처리 실패: '+e.message); }
};
// 검진 결과 PDF: 링크를 발급하지 않고 로그인한 관리자 권한으로 직접 받아 저장
window.dlPdf=async function(btn,id,i){
  const p=privs[id]||{}; const health=((p.health)||[]).filter(h=>h.date).sort((a,b)=>b.date.localeCompare(a.date)); const x=health[i]; if(!x||!x.pdf) return;
  const orig=btn.textContent; btn.disabled=true; btn.textContent='받는 중…';
  try{
    const blob=await getBlob(sref(storage,x.pdf.path)); const url=URL.createObjectURL(new Blob([blob],{type:'application/pdf'}));
    const a=document.createElement('a'); a.href=url; a.download=((byId(id)||{}).name||'근로자')+'_'+(HEALTH_TYPES[x.type]||'검진')+'_'+x.date+'.pdf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000); btn.textContent='✔ 받았습니다';
  }catch(e){ alert('다운로드 실패: '+e.message+'\n(관리자 계정으로 로그인했는지 확인해 주세요)'); btn.textContent=orig; }
  setTimeout(()=>{ btn.disabled=false; btn.textContent=orig; },2500);
};
window.dlChemPdf=async function(btn,id,ix){
  const p=privs[id]||{}; const x=((p.chemEdu)||[])[ix]; if(!x||!x.pdf) return;
  const orig=btn.textContent; btn.disabled=true; btn.textContent='받는 중…';
  try{
    const blob=await getBlob(sref(storage,x.pdf.path)); const url=URL.createObjectURL(new Blob([blob],{type:'application/pdf'}));
    const a=document.createElement('a'); a.href=url; a.download=((byId(id)||{}).name||'근로자')+'_화학물질안전원교육_'+(x.date||'')+'.pdf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000); btn.textContent='✔ 받았습니다';
  }catch(e){ alert('다운로드 실패: '+e.message+'\n(권한 계정으로 로그인했는지 확인해 주세요)'); btn.textContent=orig; }
  setTimeout(()=>{ btn.disabled=false; btn.textContent=orig; },2500);
};
function render(){
  if(loadError){ $app().innerHTML=topBar()+'<div class="err">'+esc(loadError)+'</div>'; return; }
  if(view==='detail') renderDetail(); else renderListPage();
}
async function load(){
  try{
    // 근로자 정보는 master_worker_info(실무자), 은행·계좌·일당은 master_worker_private(관리자 전용) — 관리자만 두 번째 문서를 읽고, 같은 항목이 양쪽에 있으면 info 가 우선
    const [ms,is]=await Promise.all([getDocs(collection(db,'master_workers')),getDocs(collection(db,'master_worker_info'))]);
    let ps=null; try{ ps=await getDocs(collection(db,'master_worker_private')); }catch(_){ ps=null; }
    masters=[]; ms.forEach(d=>masters.push({id:d.id,...d.data()})); privs={}; if(ps) ps.forEach(d=>{privs[d.id]=Object.assign({},d.data());}); is.forEach(d=>{privs[d.id]=Object.assign({},privs[d.id]||{},d.data());});
    render();
  }catch(e){
    loadError=/permission|insufficient/i.test(e.message)?'PJT 권한이 있는 계정만 볼 수 있는 화면입니다. 권한이 필요하면 관리자에게 요청해 주세요.':('불러오지 못했습니다: '+e.message);
    render();
  }
}
onAuthStateChanged(auth,user=>{
  if(!user){ $app().innerHTML=topBar()+'<div class="err">로그인이 필요합니다.<br><a class="tel" href="../index.html">포털에서 로그인</a> 후 다시 열어 주세요.</div>'; return; }
  load();
});
</script>
